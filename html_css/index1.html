<!-- -----------Flexbox------ -->

<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Flexbox Playground</h1>
        <div id="container">
            <div id="box1" style="background-color:brown;"> box1 </div>
            <div id="box2" style="background-color: green;"> box2 </div>
            <div id="box3" style="background-color:rgb(77, 36, 116)"> box3</div>
            <div id="box4" style="background-color:rgb(175, 201, 28)"> box4</div>
        </div>    
    </body>
</html>
